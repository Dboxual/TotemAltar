plugins {
    id 'java'
}

group = 'com.totemaltars'

// ── Versioning ────────────────────────────────────────────────────────────────
// version.properties holds the base version. Edit it manually to bump.
// Pass -Psuffix=beta (or any label) to append a suffix without touching the file.
//   gradle jar              → TotemAltars-1.0.21.jar
//   gradle jar -Psuffix=debug  → TotemAltars-1.0.21-debug.jar

def versionFile = file('version.properties')
def props = new Properties()
versionFile.withInputStream { props.load(it) }
def baseVersion = props.getProperty('version', '1.0.0')
def suffix      = project.hasProperty('suffix') ? "-${project.property('suffix')}" : ''
version = baseVersion + suffix
logger.lifecycle("TotemAltars version: ${version}")

// ── Java ──────────────────────────────────────────────────────────────────────
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ── Repositories ─────────────────────────────────────────────────────────────
repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'dmulloy2'
        url = 'https://repo.dmulloy2.net/repository/public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

// ── Dependencies ─────────────────────────────────────────────────────────────
dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
}

// ── Resources: stamp plugin.yml with the build version ───────────────────────
processResources {
    filesMatching('plugin.yml') {
        expand(pluginVersion: project.version)
    }
}

// ── JAR ───────────────────────────────────────────────────────────────────────
jar {
    // Lazy provider reads version AFTER incrementVersion has mutated project.version
    archiveFileName = provider { "TotemAltars-${project.version}.jar" }
}
