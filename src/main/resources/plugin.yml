name: TotemAltars
version: '1.1.23'
main: com.totemaltars.TotemAltars
api-version: '1.21'
description: Custom Totem Shards dropped by hostile mobs — foundation for the shard system.
authors: [ Dboxual ]

commands:
  totemaltars:
    description: TotemAltars admin commands.
    usage: /totemaltars <giveshard|givealtar|givefinishedaltar|givebedrockrelic|givetotem|purgelegacy|reload>

permissions:
  totemaltars.admin:
    description: Access to all TotemAltars admin commands.
    default: op
