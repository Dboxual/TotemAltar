# ============================================================
#  TotemAltars Configuration  —  v1.1.25
# ============================================================

shard:
  # Chance (0.0–1.0) that a hostile mob killed by a player drops a Totem Shard.
  # 0.01 = 1% chance. Lowered from 0.05 in v1.1.11 due to high acquisition rate
  # on established mob farms. Raise this value if drops feel too rare.
  drop-chance: 0.01
  item-name: "&dTotem Shard"
  # Sound played to the player when a shard finishes morphing into a typed shard.
  morph-sound: ENTITY_PLAYER_LEVELUP
  # Particle burst spawned on the player when a shard morphs.
  morph-particle: TOTEM_OF_UNDYING

# ── Affinity progression ────────────────────────────────────────────────────
# threshold: how many matching mob kills are needed to morph a shard.
# mob-types: maps each affinity type to the list of EntityType names that
#            contribute to it. Names must match Bukkit EntityType constants
#            exactly (uppercase, e.g. WITHER_SKELETON).
# The first affinity to reach the threshold permanently morphs the shard.
# Add or remove mobs freely — all mappings are read from config at runtime.
affinity:
  threshold: 10
  mob-types:
    blast:
      - CREEPER
      - WITHER_SKELETON
    storm:
      - ENDERMAN
    shadow:
      - WITCH
      - EVOKER
    guardian:
      - WARDEN
    swap:
      - PIGLIN_BRUTE

# ── Altar ────────────────────────────────────────────────────────────────────
# The Totem Altar item is a DAMAGED_ANVIL with a custom PDC tag.
# Placed altar begins INACTIVE (Damaged Anvil in world).
# Repair ritual (right-click + insert Wither Skull) upgrades it to ACTIVE (Anvil).
altar:
  item-name: "&5Totem Altar"
  # Shaped crafting recipe for the Totem Altar.
  # Each row must be exactly 3 characters. Use a space for empty slots.
  # ingredient keys below map each character to a Bukkit Material name.
  recipe:
    shape:
      - "OOO"
      - "DED"
      - "ONO"
    ingredients:
      O: OBSIDIAN
      E: ECHO_SHARD
      D: DIAMOND
      N: NETHER_STAR

  # ── Hologram ─────────────────────────────────────────────────────────────────
  # Floating text displayed above every placed altar.
  hologram:
    enabled: true
    # Use legacy colour codes: &c=red &b=aqua &5=purple &a=green &l=bold
    # Text shown when the altar is inactive (unrepaired) — red to signal broken state
    inactive-text: "&c&l✦ BROKEN ALTAR ✦"
    # Text shown when the altar has been restored — instructs player to insert a typed shard
    active-text: "&b&l✦ INSERT SHARD ✦"
    # Text shown while the altar is waiting for a Totem of Undying to be inserted
    awaiting-totem-text: "&e&l⚡ INSERT TOTEM ⚡"
    # Text shown after forging is complete and the totem is waiting to be claimed
    totem-ready-text: "&a&l✦ CLAIM YOUR TOTEM ✦"
    # Title line displayed above the kill counter during a repair ritual
    ritual-title: "&5&lRITUAL"
    # Kill counter line during ritual — {current} and {required} are replaced at runtime
    ritual-counter-format: "&dSouls: {current} / {required}"
    # Height in blocks above the altar block's base (2.5 clears the anvil model)
    height: 2.5

  # ── Placement effect ─────────────────────────────────────────────────────────
  # Sound and particle burst fired when an altar item is placed.
  placement-effect:
    enabled: true
    # Bukkit Sound enum name (uppercase). Example: ENTITY_EVOKER_CAST_SPELL
    sound: ENTITY_EVOKER_CAST_SPELL
    # Bukkit Particle enum name (uppercase, data-less only). Example: PORTAL
    particle: PORTAL

  # ── Idle particles ───────────────────────────────────────────────────────────
  # Slow ambient particles emitted around every placed altar while it exists.
  idle-particles:
    enabled: true
    # Bukkit Particle enum name (data-less only). WITCH = small green spell sparks.
    particle: WITCH
    # Ticks between each particle pulse  (20 = 1 s, 40 = 2 s, 60 = 3 s)
    interval-ticks: 40

# ── Ritual ───────────────────────────────────────────────────────────────────
ritual:
  # How many ritual mobs must die for the ritual to complete.
  required-kills: 25
  # Maximum ritual mobs alive at the same time per altar.
  max-alive-mobs: 6
  # Ticks between mob top-up spawns (20 ticks = 1 second).
  spawn-interval-ticks: 60
  # Spawn radius in blocks from the altar (random within min–max).
  spawn-radius-min: 3
  spawn-radius-max: 7
  # Visual-only lightning strike on each ritual mob spawn (no damage, no fire, no player hurt)
  spawn-lightning-effect-enabled: true
  # Block radius within which nearby players receive broadcast messages.
  broadcast-radius: 30
  # Mob pool for ritual spawns. Must be valid Bukkit EntityType names.
  mob-pool:
    - ZOMBIE
    - HUSK
    - SKELETON
    - BLAZE
    - VEX

  # ── Vex spawning ─────────────────────────────────────────────────────────────
  # VEX must appear in mob-pool above for these settings to have any effect.
  vex:
    enabled: true
    # Extra chance roll when VEX is drawn from the pool (0.0–1.0; 0.25 = 25%)
    spawn-chance: 0.25
    # Maximum Vex alive at once per active ritual
    max-active: 2

  # ── Ritual ambient particles ─────────────────────────────────────────────────
  # Particles spawned around the altar on each mob top-up cycle during the ritual.
  particles:
    enabled: true
    # Bukkit Particle enum name (data-less only). SOUL_FIRE_FLAME = cyan wisp.
    particle: SOUL_FIRE_FLAME

# ── Guide book ────────────────────────────────────────────────────────────────
# When a player picks up a Totem Shard for the first time they receive a written
# guide book explaining the altar recipe and forge flow. Set enabled: false to
# disable this entirely. The UUID list is stored in player_data.yml.
guide-book:
  enabled: true
  # Sound played to the player when the book is given.
  # Bukkit Sound enum name (uppercase). ITEM_BOOK_PAGE_TURN = page-turn sound.
  sound: ITEM_BOOK_PAGE_TURN

# ── Global cooldown ───────────────────────────────────────────────────────────
# Seconds a player must wait between any custom totem ability activations.
global-cooldown: 15

# ── Totem ability settings ────────────────────────────────────────────────────
abilities:
  blast:
    radius: 8.0
    knockback-strength: 3.0
  shadow:
    # Seconds the Shadow Totem invisibility lasts.
    duration-seconds: 15
  storm:
    # Teleport distance range in blocks from the player's current position.
    min-distance: 25
    max-distance: 35
    # How many random locations to try before giving up.
    max-attempts: 50
  swap:
    # Maximum block distance to find a swap target.
    range: 25.0

# ── Bedrock Relic ─────────────────────────────────────────────────────────────
# The Bedrock Relic is a separate progression item dropped in structure loot
# chests. It is NOT a Totem Shard. Activate it on a Bedrock block, then bind
# it to a repaired Totem Altar to open one BedRocker pickaxe enchant.
bedrock-relic:
  # Chance (0.0–1.0) that one Bedrock Relic appears in a Bastion Remnant chest.
  # 0.05 = 5% per chest.
  # NOTE: the old key "spawn-chance" is still honored if it already exists in
  # your config.yml from an earlier version — it will keep overriding this
  # value until you remove it. New installs should use "bastion-chance".
  bastion-chance: 0.05
  # Chance (0.0–1.0) that one Bedrock Relic appears in an Ancient City chest
  # (includes the frozen suspicious-sand loot table). 0.08 = 8% per chest.
  ancient-city-chance: 0.08
  # Chance (0.0–1.0) that one Bedrock Relic appears in a Nether Fortress chest.
  # 0.06 = 6% per chest.
  nether-fortress-chance: 0.06
  # Chance (0.0–1.0) that one Bedrock Relic appears in a Stronghold chest
  # (corridor, crossing, and library loot tables). 0.05 = 5% per chest.
  stronghold-chance: 0.05
  # Seconds required to mine a Bedrock block with a BedRocker pickaxe.
  # Crack animation progresses visually over this duration. Default 5.
  break-seconds: 5
  # Duration (ticks) of the Totem Altar binding sequence.
  # 100 ticks = 5 seconds. Must stand near the altar for this duration.
  binding-ticks: 100
  # Extra durability consumed from a BedRocker pickaxe when Bedrock is destroyed.
  durability-cost: 100

# ── Legacy ingredient cleanup ────────────────────────────────────────────────
# Removes old pre-shard-system ingredient items from online players, ender chests,
# loaded tile inventories, and shulker boxes contained inside those inventories.
legacy-cleanup:
  enabled: true
  on-enable-loaded-containers: true
  on-player-join: true
  on-chunk-load: true
  scan-shulker-contents: true
  log-removals: true

